#
# The reference data sets of the regression suite (#696, ADR-0073). One [[dataset]] entry for
# each file. tests/reference_data/fetch.py reads it, and tests/test_reference_data.py holds every
# entry to the rules:
#
#   id            short, lower-case, unique; a test asks fetch.path_for(id) for the file
#   source        "doi:10.…" or "accession:…"
#   record_url    the landing page of the record (https)
#   license       an SPDX id with a file in LICENSES/
#   file          git / lfs: the committed path; download: the file name in the cache;
#                 workstation: the path below the directory that `env` names
#   size, sha256  bytes and SHA-256 of the file itself
#   tier          git (at most 1 MB), lfs (all LFS files together at most 50 MB),
#                 download (at most 200 MB, needs download_url), workstation (needs env)
#   citation      the text to cite the set with
#
# A committed extract of a larger set names its sources in `extract_of`, and either the
# `extract_script` that makes it or the `extract_member` it copies verbatim from one archive.
# A committed third-party file also needs its REUSE.toml annotation, a NOTICE entry and a
# tests/fixtures/PROVENANCE.md entry. Only data that can be downloaded now, with no request to a
# person, under a licence that permits the copy or the download (#696, Q21).

# --- kinSoftChallenge simulated data sets: Zenodo 10.5281/zenodo.5701310, CC-BY-4.0 ----------

