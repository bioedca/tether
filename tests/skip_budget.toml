# --- Expected skips on the three required legs ---------------------------------------------

[[skip]]
test = "tests/test_coverage_floors.py::test_floors_never_go_down"
reason = "no origin/main in this checkout (CI's Linux leg fetches it and sets TETHER_COVERAGE_BASE_REF)"
jobs = ["test (macos-latest)", "test (windows-latest)"]
why = """The coverage-floor ratchet (#724, ADR-0072) compares the floors with the copy on main. \
Only the Linux leg fetches main and sets TETHER_COVERAGE_BASE_REF, which makes the test fail \
instead of skip there; the macOS and Windows legs do not change, so they have no main to read."""

[[skip]]
test = "tests/test_docstring_standard.py::test_allowlist_never_grows"
reason = "no origin/main in this checkout (CI's Linux leg fetches it and sets TETHER_DOCSTRING_BASE_REF)"
jobs = ["test (macos-latest)", "test (windows-latest)"]
why = """The docstring-allowlist ratchet (#611, ADR-0093) compares the allowlist with the copy on \
main, like the coverage-floor ratchet above. Only the Linux leg fetches main and sets \
TETHER_DOCSTRING_BASE_REF, which makes the test fail instead of skip there."""

[[skip]]
test = "tests/test_deep_gpu_deep.py"
reason = "could not import 'torch': No module named 'torch'"
jobs = ["test (ubuntu-latest)", "test (macos-latest)", "test (windows-latest)", "large-fixtures"]
why = """torch is only in the isolated deep stack (ADR-0047); the base environment of these \
jobs has none. The module skips at import, before `-m` can deselect its `deep` tests, so it is \
one skip and not a missing test. deep / smoke runs the module in the deep environment."""

