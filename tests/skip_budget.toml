#
# The skip budget of each CI job that runs pytest (#726). After pytest writes its JUnit
# report, `scripts/check_skips.py --job "<check name>"` compares the report with this file and
# fails the job when:
#
#   * a test skips and no [[skip]] entry below lists that job, matches the node id (`test`, an
#     exact node id or an fnmatch pattern) and has the same reason (`reason`, exact text);
#   * more tests skip than the job's `max_skipped`;
#   * fewer tests are in the report than the job's `min_collected` (a path filter, a marker
#     expression or a module-level skip took tests out of the run).
#
# A pull request that adds a skip adds an entry here with `why`: the reason the skip is
# correct on each job that it lists. A pull request that removes tests on purpose lowers
# `min_collected` here. Both changes are then visible in review. The script prints a notice
# when a limit is loose (fewer skips than `max_skipped`, more tests than `min_collected`).
#
# The counts were measured on main at 4f2468e (2026-11-12) with this file's own tests: the
# three required legs and the large-fixtures job from their CI logs and a local run,
# sidecar / parity and deep / smoke from a local run in the locked sidecar and deep
# environments.

# --- The jobs: one table for each check name -----------------------------------------------

