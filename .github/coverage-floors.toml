#
# Coverage floors (issue #724, ADR-0072). Each value is the lowest LINE coverage, in percent,
# that the Linux leg of the required `test` matrix accepts: `total` for all of `src/tether`, and
# one per package of `src/tether`. `scripts/check_coverage_floors.py` fails the job below a
# floor, and `tests/test_coverage_floors.py` fails when a value here is lower than on `main` or
# is removed. So a floor can only go up. Raise one when the job's notice says it can.
#
# Start values: the rule of the maintainer decision on #724 ("the measured value, rounded down"),
# applied to the first CI measurement of the Linux leg (PR #792, main 9c3453a). The issue's own
# numbers came from main at 4094720; since then `gui` fell to 93.22 % (new brand code), and `ml`
# rose to 93.82 % because the torch-only module is now excluded by name.
[floors]
total = 94
analysis = 97
fret = 98
gui = 93
idealize = 91
imaging = 93
io = 95
ml = 93
project = 95
