#
# Feature / enhancement issue form (PRD §12.5). Use for a new capability or a
# change to planned behavior. Prefer to tie the request to a PRD requirement
# (FR-ID / §-number) so it threads to the roadmap (PRD §9, §12.7).
name: Feature / enhancement
description: Propose a new capability or a change to planned behavior.
title: "feat(<scope>): <summary>"
labels: ["type:feature", "status:backlog"]
body:
  - type: markdown
    attributes:
      value: |
        Keep the title in Conventional-Commit form (`type(scope): summary`) — it
        becomes the squash-merge title of the implementing PR (PRD §12.2). A new
        user-facing scientific claim must carry a citation; a new tunable must be
        registered in **PRD §11.2** (single source of truth), not hardcoded.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What can't be done today, and why it matters.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The capability or behavior change you want.
    validations:
      required: true
  - type: input
    id: prd-ref
    attributes:
      label: PRD reference (FR-ID / §-number)
      description: The requirement this implements or amends, if known.
      placeholder: FR-EXTRACT / §7.1 ; or "none — new requirement"
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Target module (PRD §4.2)
      options:
        - "io"
        - "imaging"
        - "fret"
        - "idealize"
        - "ml"
        - "analysis"
        - "gui"
        - "project"
        - "schema"
        - "sidecar"
        - "packaging"
        - "unknown"
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: Milestone (PRD §9)
      options:
        - "M0"
        - "M0.5"
        - "M1"
        - "M2"
        - "M3"
        - "M4"
        - "M5"
        - "M6"
        - "M7"
        - "M8"
        - "M9"
        - "M10"
        - "unknown"
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we will know it is done (testable, ties to a §9 clause where possible).
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: Bound the proposal to one PR and state what it will not change.
      placeholder: "In scope: ...; out of scope: ..."
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size estimate
      description: >-
        The diff budget the fixing PR gets, counted in lines it ADDS; lockfiles and
        generated files do not count. Over budget the work is split, not argued.
      options:
        - "XS — up to 50 added lines"
        - "S — up to 150 added lines"
        - "M — up to 400 added lines"
        - "L — up to 900 added lines, the largest budget there is"
        - "unsure — leave it to grooming"
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk level
      description: >-
        How much scrutiny this deserves, not the priority - and not the reviewer:
        every item walks the same review lane. What it decides is whether a metered
        Greptile credit is worth spending. High covers scientific logic or claims,
        data, provenance, schema, security, dependencies, CI/release, a public API,
        persistence or migration, concurrency, HPC/Slurm, and broad cross-component
        work.
      options:
        - "low — the lane: Codex on the draft, then CodeRabbit"
        - "standard — the lane: Codex on the draft, then CodeRabbit"
        - "high — the lane, and a Greptile credit is worth spending if the seat has budget"
        - "unsure — leave it to grooming"
    validations:
      required: true
  - type: dropdown
    id: adr_needed
    attributes:
      label: Does this need an architecture decision record?
      description: >-
        An ADR lands in the same PR as the change it records: a schema or version
        change, a dependency or isolation boundary, an architectural choice, or a
        scientifically consequential one.
      options:
        - "no"
        - "yes — a decision gets made here"
        - "unsure — leave it to grooming"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / blockers
      description: Link blocking work or write the literal `none`.
      placeholder: none
    validations:
      required: true
  - type: dropdown
    id: autonomy
    attributes:
      label: Execution autonomy
      description: What kind of action or decision is needed to finish this work?
      options:
        - "agent-can-do-alone"
        - "maintainer decision required"
        - "external/human action required"
    validations:
      required: true
  - type: textarea
    id: overlap
    attributes:
      label: Related work / file overlap
      description: Link related issues or name likely overlapping files; write `none` if there is no overlap.
      placeholder: none
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Required safety attestations
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I am not reporting a vulnerability publicly; security reports use the private advisory flow.
          required: true
        - label: I included no secrets or private, raw, unlicensed, user, or lab data.
          required: true
  - type: checkboxes
    id: proposal-checks
    attributes:
      label: Proposal checks
      options:
        - label: A new scientific/statistical claim, if any, will carry a literature citation.
          required: false
        - label: A new tunable, if any, will be registered in PRD §11.2 (not hardcoded).
          required: false
