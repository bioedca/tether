#
# Maintenance issue form (PRD §12.5). This closes the structured-intake gap
# while blank issues remain disabled. It starts as type:chore; maintainers may
# correct the type during grooming for CI, test, refactor, or governance work.
name: Maintenance / engineering work
description: Propose chore, CI, test, refactor, or governance work.
title: "chore(<scope>): <summary>"
labels: ["type:chore", "status:backlog"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for bounded engineering work that is not a shipped bug or
        feature. The static `type:chore` label keeps intake predictable; a
        maintainer may correct it during grooming.
  - type: dropdown
    id: kind
    attributes:
      label: Maintenance kind
      options:
        - "chore"
        - "CI"
        - "test"
        - "refactor"
        - "governance"
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: Work requested
      description: Describe the current maintenance burden and the desired change.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable conditions that prove the maintenance work is complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: Bound the work to one PR and state what it will not change.
      placeholder: "In scope: ...; out of scope: ..."
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size estimate
      description: >-
        The diff budget the fixing PR gets, counted in lines it ADDS; lockfiles and
        generated files do not count. Over budget the work is split, not argued.
      options:
        - "XS — up to 50 added lines"
        - "S — up to 150 added lines"
        - "M — up to 400 added lines"
        - "L — up to 900 added lines, the largest budget there is"
        - "unsure — leave it to grooming"
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk level
      description: >-
        How much scrutiny this deserves, not the priority - and not the reviewer:
        every item walks the same review lane. What it decides is whether a metered
        Greptile credit is worth spending. High covers scientific logic or claims,
        data, provenance, schema, security, dependencies, CI/release, a public API,
        persistence or migration, concurrency, HPC/Slurm, and broad cross-component
        work.
      options:
        - "low — the lane: Codex on the draft, then CodeRabbit"
        - "standard — the lane: Codex on the draft, then CodeRabbit"
        - "high — the lane, and a Greptile credit is worth spending if the seat has budget"
        - "unsure — leave it to grooming"
    validations:
      required: true
  - type: dropdown
    id: adr_needed
    attributes:
      label: Does this need an architecture decision record?
      description: >-
        An ADR lands in the same PR as the change it records: a schema or version
        change, a dependency or isolation boundary, an architectural choice, or a
        scientifically consequential one.
      options:
        - "no"
        - "yes — a decision gets made here"
        - "unsure — leave it to grooming"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / blockers
      description: Link blocking work or write the literal `none`.
      placeholder: none
    validations:
      required: true
  - type: dropdown
    id: autonomy
    attributes:
      label: Execution autonomy
      description: What kind of action or decision is needed to finish this work?
      options:
        - "agent-can-do-alone"
        - "maintainer decision required"
        - "external/human action required"
    validations:
      required: true
  - type: textarea
    id: overlap
    attributes:
      label: Related work / file overlap
      description: Link related issues or name likely overlapping files; write `none` if there is no overlap.
      placeholder: none
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Target area
      options:
        - "io"
        - "imaging"
        - "fret"
        - "idealize"
        - "ml"
        - "analysis"
        - "gui"
        - "project"
        - "schema"
        - "sidecar"
        - "packaging"
        - "CI / repository governance"
        - "unknown"
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: Milestone
      options:
        - "M0"
        - "M0.5"
        - "M1"
        - "M2"
        - "M3"
        - "M4"
        - "M5"
        - "M6"
        - "M7"
        - "M8"
        - "M9"
        - "M10"
        - "none / cross-cutting"
        - "unknown"
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Required safety attestations
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I am not reporting a vulnerability publicly; security reports use the private advisory flow.
          required: true
        - label: I included no secrets or private, raw, unlicensed, user, or lab data.
          required: true
