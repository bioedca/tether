#
# Documentation issue form (PRD §12.5). A problem with the rendered docs site
# (mkdocs-material, versioned with `mike`) or with an API docstring. Use the
# "Bug report" form for a defect in shipped *behavior*; use "Feature /
# enhancement" to propose documenting a capability that does not exist yet; for
# security use the private advisory link in config.yml — never a public issue.
name: Documentation problem
description: Report something wrong, missing, unclear, stale, or broken in the docs.
title: "docs(<scope>): <summary>"
labels: ["type:docs", "area:docs", "status:backlog"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for improving the docs. Please keep the title in
        Conventional-Commit form (`docs(scope): summary`) — it becomes the
        squash-merge title of the fixing PR (PRD §12.2). Report what the page
        says **today**; the site is versioned, so the exact page URL and the
        version from the selector are what let us reproduce it. **Do not** paste
        real lab experimental data or the contents of a user `.tether` project.
  - type: input
    id: page
    attributes:
      label: Page URL
      description: The full URL from the address bar, including the version segment.
      placeholder: https://bioedca.github.io/tether/latest/io/legacy-import/
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Docs version
      description: The entry selected in the version selector at the top of the page.
      options:
        - "latest (the current release alias)"
        - "dev (unreleased, published from a manual dispatch)"
        - "a pinned older version — name it under 'What you expected'"
        - "built locally (mkdocs build / mkdocs serve)"
        - "unsure"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of problem
      options:
        - "wrong — the page states something that is not true of the code"
        - "missing — a behavior that ships is not documented anywhere"
        - "unclear — accurate, but a reader cannot act on it"
        - "broken link — a dead internal/external link, anchor, or image"
        - "stale — true of an older version, superseded by current behavior"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Documented module (PRD §4.2)
      description: The §4.2 module / cross-cutting area the page covers.
      options:
        - "io"
        - "imaging"
        - "fret"
        - "idealize"
        - "ml"
        - "analysis"
        - "gui"
        - "project"
        - "schema"
        - "sidecar"
        - "packaging"
        - "site-wide (nav, landing page, ADR index, search)"
        - "unknown"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: >-
        What you came to the page to find out, and what you believed after
        reading it. Quote the sentence that misled you where there is one.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
      description: >-
        The wording, missing section, or link target you would put there.
        A rough draft is welcome — prose is easier to edit than to invent.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable conditions that prove the documentation problem is resolved.
      placeholder: |
        - [ ] The named page states the current behavior accurately.
        - [ ] `mkdocs build --strict` passes.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: Bound the documentation change to one PR and state what it will not cover.
      placeholder: "In scope: ...; out of scope: ..."
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size estimate
      description: >-
        The diff budget the fixing PR gets, counted in lines it ADDS; lockfiles and
        generated files do not count. Over budget the work is split, not argued.
      options:
        - "XS — up to 50 added lines"
        - "S — up to 150 added lines"
        - "M — up to 400 added lines"
        - "L — up to 900 added lines, the largest budget there is"
        - "unsure — leave it to grooming"
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk level
      description: >-
        This picks the reviewer, not the priority. High covers scientific logic or
        claims, data, provenance, schema, security, dependencies, CI/release, a public
        API, persistence or migration, concurrency, HPC/Slurm, and broad
        cross-component work.
      options:
        - "low — the lane: Codex on the draft, then CodeRabbit"
        - "standard — the lane: Codex on the draft, then CodeRabbit"
        - "high — the lane, and spend a Greptile credit before going ready"
        - "unsure — leave it to grooming"
    validations:
      required: true
  - type: dropdown
    id: adr_needed
    attributes:
      label: Does this need an architecture decision record?
      description: >-
        An ADR lands in the same PR as the change it records: a schema or version
        change, a dependency or isolation boundary, an architectural choice, or a
        scientifically consequential one.
      options:
        - "no"
        - "yes — a decision gets made here"
        - "unsure — leave it to grooming"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / blockers
      description: Link blocking work or write the literal `none`.
      placeholder: none
    validations:
      required: true
  - type: dropdown
    id: autonomy
    attributes:
      label: Execution autonomy
      description: What kind of action or decision is needed to finish this work?
      options:
        - "agent-can-do-alone"
        - "maintainer decision required"
        - "external/human action required"
    validations:
      required: true
  - type: textarea
    id: overlap
    attributes:
      label: Related work / file overlap
      description: Link related issues or name likely overlapping files; write `none` if there is no overlap.
      placeholder: none
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Required safety attestations
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I am not reporting a vulnerability publicly; security reports use the private advisory flow.
          required: true
        - label: I included no secrets or private, raw, unlicensed, user, or lab data.
          required: true
  - type: checkboxes
    id: contributor-interest
    attributes:
      label: Contributor interest
      options:
        - label: I am willing to open the PR for this myself.
          required: false
