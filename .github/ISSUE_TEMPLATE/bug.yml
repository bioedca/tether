#
# Bug report issue form (PRD §12.5). A reproducible defect in shipped behavior.
# For a failed validation oracle (PRD §8 NFR-VALID a–g) use the dedicated
# "Validation-oracle failure" form instead; for security use the private
# advisory link in config.yml (PVR, SECURITY.md) — never a public issue.
name: Bug report
description: Report a reproducible defect in Tether.
title: "fix(<scope>): <summary>"
labels: ["type:bug", "status:backlog"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please keep the title in Conventional-Commit
        form (`type(scope): summary`) — it becomes the squash-merge title of the
        fixing PR (PRD §12.2). **Do not** attach real lab experimental data or a
        user `.tether` project; use a small committed fixture or a synthetic case.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug and the impact.
      placeholder: Opening a big-endian movie raises ... instead of displaying it.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal, deterministic steps. Prefer a committed fixture path.
      placeholder: |
        1. open `tests/fixtures/movie_be_64x64x50.tif`
        2. call ...
        3. observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable conditions that prove the defect is fixed.
      placeholder: |
        - [ ] A regression test reproduces the failure before the fix.
        - [ ] The same test passes after the fix.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: Bound the fix to one PR and state what it will not change.
      placeholder: "In scope: ...; out of scope: ..."
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size estimate
      description: >-
        The diff budget the fixing PR gets, counted in lines it ADDS; lockfiles and
        generated files do not count. Over budget the work is split, not argued.
      options:
        - "XS — up to 50 added lines"
        - "S — up to 150 added lines"
        - "M — up to 400 added lines"
        - "L — up to 900 added lines, the largest budget there is"
        - "unsure — leave it to grooming"
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk level
      description: >-
        This picks the reviewer, not the priority. High covers scientific logic or
        claims, data, provenance, schema, security, dependencies, CI/release, a public
        API, persistence or migration, concurrency, HPC/Slurm, and broad
        cross-component work.
      options:
        - "low — the lane: Codex on the draft, then CodeRabbit"
        - "standard — the lane: Codex on the draft, then CodeRabbit"
        - "high — the lane, and spend a Greptile credit before going ready"
        - "unsure — leave it to grooming"
    validations:
      required: true
  - type: dropdown
    id: adr_needed
    attributes:
      label: Does this need an architecture decision record?
      description: >-
        An ADR lands in the same PR as the change it records: a schema or version
        change, a dependency or isolation boundary, an architectural choice, or a
        scientifically consequential one.
      options:
        - "no"
        - "yes — a decision gets made here"
        - "unsure — leave it to grooming"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / blockers
      description: Link blocking work or write the literal `none`.
      placeholder: none
    validations:
      required: true
  - type: dropdown
    id: autonomy
    attributes:
      label: Execution autonomy
      description: What kind of action or decision is needed to finish this work?
      options:
        - "agent-can-do-alone"
        - "maintainer decision required"
        - "external/human action required"
    validations:
      required: true
  - type: textarea
    id: overlap
    attributes:
      label: Related work / file overlap
      description: Link related issues or name likely overlapping files; write `none` if there is no overlap.
      placeholder: none
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected module (PRD §4.2)
      description: The §4.2 module / cross-cutting area closest to the defect.
      options:
        - "io"
        - "imaging"
        - "fret"
        - "idealize"
        - "ml"
        - "analysis"
        - "gui"
        - "project"
        - "schema"
        - "sidecar"
        - "packaging"
        - "unknown"
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: Milestone
      description: The roadmap milestone this belongs to (PRD §9).
      options:
        - "M0"
        - "M0.5"
        - "M1"
        - "M2"
        - "M3"
        - "M4"
        - "M5"
        - "M6"
        - "M7"
        - "M8"
        - "M9"
        - "M10"
        - "unknown"
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Tether version (`tether --version`), base vs sidecar env.
      placeholder: |
        - OS: Windows 11
        - tether --version: 0.0.1.dev11+g031de7d
        - env: base (PySide6 / numpy 2.x) | sidecar (PyQt5 / numpy<2)
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Traceback / logs
      description: Paste the full traceback. It is rendered as code automatically.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Required safety attestations
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I am not reporting a vulnerability publicly; security reports use the private advisory flow.
          required: true
        - label: I included no secrets or private, raw, unlicensed, user, or lab data.
          required: true
