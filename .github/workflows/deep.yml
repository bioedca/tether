# SPDX-License-Identifier: GPL-3.0-or-later
#
# deep / smoke — the M8 deep-classifier CPU train-smoke (ADR-0047 "Option A";
# PRD §4.1, §9 M8, FR-ML). It provisions the THIRD, ISOLATED `deep/` conda stack
# (deep/conda-lock.yml — pytorch-cpu + numpy/scipy/h5py, never the base GUI stack
# or the tMAVEN sidecar) and runs the live `@pytest.mark.deep` suite: build a tiny
# 1-D CNN/LSTM on synthetic labeled traces, assert it trains + predicts + is
# reproducible on CPU (§9 M8 "a deep classifier trains on the shared label store
# and is optional — CPU base app unaffected").
#
# NON-REQUIRED by design: this is the optional GPU-add-on's CPU proxy, deliberately
# outside the `main-baseline` required set so it never gates a merge and the base
# app stays torch-free. Because it is not required, a `paths:` filter is safe (an
# unrelated PR simply does not run it — no "required check never reports" footgun,
# unlike the required sidecar leg which self-gates internally instead).
#
# The base 3-OS `test` matrix (ci.yml) DESELECTS the `deep` marker
# (`-m "not large and not sidecar and not deep"`); tests/test_marker_contract.py
# keeps the `tests/test_*_deep.py` collection glob below in lockstep with the
# marker so a new deep test cannot silently escape this job.
name: deep

on:
  pull_request:
    # Only the paths that can change a deep-classifier result (or this job).
    paths:
      - "deep/**"
      - "src/tether/ml/**"
      # The store-to-train test imports these three directly (#752).
      - "src/tether/project/deep_dataset.py"
      - "src/tether/project/features.py"
      - "src/tether/project/labels.py"
      - "tests/test_*_deep.py"
      # The PySMACKS reference of #759 (ADR-0098): its helpers, the committed split and floor,
      # the golden file, the reader and fetcher of the data, and the ranker comparison with the
      # feature code it reads.
      - "tests/_deep_reference.py"
      - "tests/_golden.py"
      - "tests/_openfret.py"
      - "tests/reference_data/**"
      - "tests/golden/deep/**"
      - "scripts/compare_deep_with_ranker.py"
      - "schema/deep_classifier_reference.json"
      - "scripts/update_deep_golden.py"
      - "src/tether/analysis/crosscorr.py"
      - "src/tether/analysis/overlap.py"
      - "src/tether/fret/efficiency.py"
      - "pyproject.toml"
      - ".github/workflows/deep.yml"
      - ".github/actions/setup-env/**"
  workflow_dispatch:
  schedule:
    # Nightly at 04:23 UTC (off the hour; distinct from the sidecar cron).
    - cron: "23 4 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: deep / smoke
    runs-on: ubuntu-latest
    # Bound the job so a hung/looping train never wedges the runner; a CPU smoke on
    # synthetic arrays is seconds of compute (the bulk is restoring the torch env).
    timeout-minutes: 30
    defaults:
      run:
        # Activate the restored micromamba deep env (init-shell: bash).
        shell: bash -el {0}
    env:
      # The PySMACKS tutorial traces (#759): downloaded once, verified against the manifest's
      # SHA-256 before each use, and cached by that checksum. A failed download fails the tests,
      # and a skip for want of the file fails the skip budget below, so it is never silent.
      TETHER_REFERENCE_DOWNLOAD: "1"
      TETHER_REFERENCE_CACHE: ${{ github.workspace }}/.reference-data-cache
      TETHER_DEEP_SCORES_OUT: ${{ github.workspace }}/deep-scores.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute the reference-data cache key from the manifest checksums
        id: key
        shell: bash -e {0}
        run: echo "key=$(python3 tests/reference_data/fetch.py cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore the reference-data cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .reference-data-cache
          key: deep-reference-data-${{ steps.key.outputs.key }}
      - name: Restore the isolated deep env + install tether (no deps)
        uses: ./.github/actions/setup-env
        with:
          environment-file: deep/conda-lock.yml
          environment-name: tether-deep
          install-tether: "true"
      - name: Install pytest into the deep env
        # pytest is a test-tooling dep layered on top of the locked runtime stack
        # (the same pattern as ci.yml's base matrix and sidecar.yml), not part of
        # the pin-and-held deep/conda-lock.yml.
        run: python -m pip install "pytest==9.1.1"
      - name: Run the deep train-smoke
        # Scope collection to the deep-model test modules only: the isolated deep env
        # lacks the base GUI/IO stack (tifffile, napari, …), so a repo-wide
        # `pytest -m deep` would abort at COLLECTION on the first unrelated base-only
        # import. The `test_*_deep.py` SUFFIX glob matches exactly the deep-model
        # smoke (test_deep_model_deep.py) and deliberately EXCLUDES files whose names
        # merely contain the substring "deep" — the M7 Deep-LASI suite
        # (test_deeplasi*.py), the substrate tests (test_*_deep_dataset.py) and
        # test_deep_lock.py — so a future base-only import in any of those can never
        # redden this leg. The glob is the contract enforced in the base matrix by
        # tests/test_marker_contract.py. `-m deep` still filters within the collected
        # files, so a non-deep-marked test that happened to match is deselected.
        # The JUnit report feeds the skip budget below (#726).
        id: pytest
        run: pytest -m deep tests/test_*_deep.py -q --junitxml="$RUNNER_TEMP/pytest-junit.xml"
      # A test that skips leaves pytest at exit 0. This step fails the job when a test skips
      # that tests/skip_budget.toml does not list for this job, when more tests skip than it
      # allows, or when fewer tests ran than its committed minimum (#726). It runs after a red
      # pytest step too.
      - name: Compare the skips with the committed budget
        if: ${{ !cancelled() && (steps.pytest.outcome == 'success' || steps.pytest.outcome == 'failure') }}
        env:
          SKIP_BUDGET_JOB: deep / smoke
        run: python scripts/check_skips.py --job "$SKIP_BUDGET_JOB" --report "$RUNNER_TEMP/pytest-junit.xml"
      - name: Keep the deep scores for the ranker job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deep-scores
          path: deep-scores.json
          if-no-files-found: warn
          retention-days: 7

  ranker:
    # The comparison with the quality ranker (#759, T1: C). The ranker needs scikit-learn, which
    # is in the base lock and not in the isolated deep stack (ADR-0047), so it runs here, in the
    # base env, on the split of schema/deep_classifier_reference.json, and the job summary puts
    # its scores beside the deep scores that `deep / smoke` kept. This check has no limit.
    name: deep / ranker
    needs: smoke
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}
    env:
      TETHER_REFERENCE_DOWNLOAD: "1"
      TETHER_REFERENCE_CACHE: ${{ github.workspace }}/.reference-data-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute the reference-data cache key from the manifest checksums
        id: key
        shell: bash -e {0}
        run: echo "key=$(python3 tests/reference_data/fetch.py cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore the reference-data cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .reference-data-cache
          key: deep-reference-data-${{ steps.key.outputs.key }}
      - name: Fetch the deep scores
        # Absent when `deep / smoke` stopped before its scores; the table then says so.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deep-scores
          path: deep-scores
      - name: Restore env + install tether
        uses: ./.github/actions/setup-env
      - name: Train the ranker on the same split and report both
        run: python scripts/compare_deep_with_ranker.py --deep-scores deep-scores/deep-scores.json

  report:
    # A failed nightly run opens or updates one issue, and the next pass says so (#697). The called
    # workflow decides the event (never a pull request) and is the only job here that writes.
    # It watches both jobs: the issue opens when either failed (#759 added `deep / ranker`).
    needs: [smoke, ranker]
    if: ${{ !cancelled() }}
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/scheduled-failure.yml
    with:
      job-name: deep
      result: ${{ contains(needs.*.result, 'failure') && 'failure' || needs.smoke.result }}
