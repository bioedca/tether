#
# Tether CI — the merge gate (PRD §12.6). Required checks active from M0:
# lint, test (3-OS), pre-commit, commitlint, secret-scan, conda-lock-verify,
# docs-build. (schema-guard lands at M0 S6; sidecar/parity at M0.5 S4; codeql is
# enabled as GitHub default setup at S4.) Every `uses:` is pinned to a 40-char
# commit SHA with a `# vX` comment (never a moving tag); permissions default to
# read and are elevated per-job only where needed. Every checkout sets
# persist-credentials: false (no job pushes; keep the token out of git config).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # ruff pinned to match the .pre-commit-config ruff-pre-commit rev (v0.15.19).
      - name: Install ruff
        run: python -m pip install "ruff==0.15.19"
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check .

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: Run all hooks
        run: pre-commit run --all-files --show-diff-on-failure --color always

  commitlint:
    # PR-title Conventional-Commits gate: the squash title becomes the commit
    # message (PRD §12.2/§12.6). Only meaningful on pull_request events.
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks reads local history only; a full clone with no persisted token.
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (mirrors push protection)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  conda-lock-verify:
    name: conda-lock-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install conda-lock
        run: python -m pip install "conda-lock==4.0.1"
      - name: Verify base + sidecar + deep locks match their environment.yml
        # `--check-input-hash` short-circuits the solve when the spec hash still
        # matches the lock; the authoritative gate is then `git diff`: a stale
        # lock would be regenerated and show a diff. conda is preinstalled on the
        # runner ($CONDA) so conda-lock never bootstraps a backend over the net.
        # The three isolated stacks (base GUI, tMAVEN sidecar, deep torch add-on)
        # are each pin-and-held and verified independently (ADR-0004/0047).
        run: |
          set -euo pipefail
          echo "$CONDA/bin" >> "$GITHUB_PATH"
          export PATH="$CONDA/bin:$PATH"
          run_check() {
            set +e
            conda-lock lock --check-input-hash -f "$1" --lockfile "$2"
            local rc=$?
            set -e
            case "$rc" in
              0|4) echo "conda-lock ran for $1 (rc=$rc)";;
              *) echo "::error::conda-lock failed for $1 (rc=$rc) — cannot verify"; return 1;;
            esac
          }
          run_check environment.yml conda-lock.yml
          run_check sidecar/environment.yml sidecar/conda-lock.yml
          run_check deep/environment.yml deep/conda-lock.yml
          if ! git diff --exit-code conda-lock.yml sidecar/conda-lock.yml deep/conda-lock.yml; then
            echo "::error::A committed lock no longer matches its environment.yml — re-run conda-lock and commit the result."
            exit 1
          fi
          echo "All three locks (base + sidecar + deep) verified against their environment.yml."

  docs-build:
    name: docs-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install mkdocs (Material)
        # Pinned toolchain shared with the release-time docs.yml publish so the
        # gate and the deploy build with an identical mkdocs/material/mike.
        run: python -m pip install -r requirements-docs.txt
      - name: Build docs (strict)
        run: mkdocs build --strict --site-dir site
      # tests/test_docs_validation_numbers.py copies Python-Markdown's fence and attr-list
      # rules rather than importing them, and the base lock carries no Markdown, so the 3-OS
      # matrix skips the parity tests. This job installs the Markdown the docs build resolves,
      # so they run here, and TETHER_REQUIRE_PYTHON_MARKDOWN makes a failed import fail
      # instead of skip (#517). pytest is pinned to the test matrix's version.
      - name: Fence-rule parity with the resolved Python-Markdown
        env:
          TETHER_REQUIRE_PYTHON_MARKDOWN: "1"
        run: |
          python -m pip install "pytest==9.1.1"
          python -m pytest -v tests/test_docs_validation_numbers.py -k python_markdown
      # The built site may load no font, image, stylesheet or script from another host, so the
      # "no third-party asset requests" sentence of docs/privacy.md stays true (#674), and each
      # page head carries its description and the citation metadata of CITATION.cff (#599). The
      # 3-OS matrix has no MkDocs and so no built site; it runs the source checks of the same
      # files and skips the built-site tests, which TETHER_BUILT_SITE turns on here.
      - name: Built site loads nothing from another host and carries the citation metadata
        env:
          TETHER_BUILT_SITE: site
        run: python -m pytest -v tests/test_docs_site_brand.py tests/test_docs_citation_head.py
      # The rendered site, so a reviewer can open the page a docs PR changes instead of
      # inferring it from markdown (#183). `--strict` only sees links it can resolve, so
      # the rendered HTML is the one place an unresolved `[text][key]` is visible as text.
      # Upload only — no permissions change, no third-party request.
      - name: Upload rendered site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: site/
          if-no-files-found: error
          retention-days: 7

  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # micromamba's bash hook (init-shell: bash) activates the env in login
        # shells; on Windows this is Git Bash. Use it for every step so the
        # `tether` environment is active.
        shell: bash -el {0}
    env:
      QT_QPA_PLATFORM: offscreen
      NAPARI_ASYNC: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore env + install tether
        uses: ./.github/actions/setup-env
      - name: Install xvfb (Linux headless GL for napari)
        if: runner.os == 'Linux'
        shell: bash -e {0}
        run: sudo apt-get update && sudo apt-get install -y xvfb
      # Test tooling is pip-installed on top of the locked runtime stack — the
      # same pattern as the lint (ruff) and docs-build (mkdocs) jobs. pytest is
      # pinned for a reproducible matrix; pytest-qt drives the `@pytest.mark.gui`
      # napari panel tests (M0 S8) against the locked napari/PySide6 stack, run
      # headless via QT_QPA_PLATFORM=offscreen (+ xvfb on Linux, below).
      # markdown-it-py is the dev-only CommonMark parser behind the agent scripts
      # (ADR-0066). The lock already carries this exact version transitively, so
      # the line is a no-op today; it is here so the requirement is stated where
      # the other tooling is, and survives a re-lock that drops the transitive path.
      - name: Install test tooling
        run: python -m pip install "pytest==9.1.1" "pytest-qt==4.5.0" "markdown-it-py==4.2.0"
      # The `large` marker needs the Git-LFS gated tier, which the default
      # checkout does not pull (PRD §8 NFR-FIXTURES) — exclude it from the required
      # matrix so a structural HDF5 fixture never gates on an LFS pull. The
      # `sidecar` marker drives the isolated tMAVEN env (numpy<2/PyQt5), which CI
      # does not build (M0.5 S1) — exclude it too; it is a dev-machine check. The
      # `deep` marker drives the isolated torch `deep/` env (ADR-0047), built only
      # on the non-required deep.yml leg — exclude it; the base app has no torch. The
      # `workstation` marker needs private laboratory data that no runner has; those
      # tests run only from scripts/workstation/run_private_checks.py on the
      # maintainer's workstation (ADR-0071) — exclude them from every job.
      # The `reference_download` marker needs the network, which the required
      # matrix never uses — it runs in the weekly reference-data.yml (ADR-0073).
      # The JUnit report feeds the skip budget below (#726).
      # Coverage (#724, ADR-0072): the Linux leg runs the same tests under `coverage` with
      # branch measurement ([tool.coverage.run] in pyproject.toml) and holds the result to
      # .github/coverage-floors.toml. The macOS and Windows legs do not change. `coverage` is
      # pip-pinned like pytest, never in conda-lock.yml, so it is not shipped in the installers.
      - name: Install coverage (Linux leg only)
        if: runner.os == 'Linux'
        run: python -m pip install "coverage==7.17.2"
      # tests/test_coverage_floors.py compares the floors with the copy on main, so a pull
      # request cannot lower one. The checkout is a single commit, so fetch main for it; the
      # repository is public, so no token is needed.
      - name: Fetch main for the coverage floor ratchet (Linux leg only)
        if: runner.os == 'Linux'
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - name: Run tests
        id: pytest
        env:
          TETHER_COVERAGE_BASE_REF: ${{ runner.os == 'Linux' && 'origin/main' || '' }}
        run: |
          if [ "${RUNNER_OS}" = "Linux" ]; then
            xvfb-run -a coverage run -m pytest -v -m "not large and not sidecar and not deep and not workstation and not reference_download" --junitxml="$RUNNER_TEMP/pytest-junit.xml"
          else
            pytest -v -m "not large and not sidecar and not deep and not workstation and not reference_download" --junitxml="$RUNNER_TEMP/pytest-junit.xml"
          fi
      # pytest exits 0 when a test skips, so a fixture, a tool or a package that goes absent
      # leaves the job green. This step fails the leg when a skip is not in
      # tests/skip_budget.toml for this leg, when more tests skip than the leg allows, or when
      # fewer tests ran than its committed minimum (#726). It runs after a red pytest step
      # too, so the job log shows both results.
      - name: Compare the skips with the committed budget
        if: ${{ !cancelled() && (steps.pytest.outcome == 'success' || steps.pytest.outcome == 'failure') }}
        env:
          SKIP_BUDGET_JOB: test (${{ matrix.os }})
        run: python scripts/check_skips.py --job "$SKIP_BUDGET_JOB" --report "$RUNNER_TEMP/pytest-junit.xml"
      # Runs after a test failure too, so the table is there to read; it fails the job when a
      # value is below its floor and prints a notice when a floor can be raised.
      - name: Coverage report and floors (Linux leg only)
        if: runner.os == 'Linux' && !cancelled()
        run: |
          coverage json -o coverage.json
          coverage report > coverage.txt
          python scripts/check_coverage_floors.py coverage.json
      - name: Upload coverage report (Linux leg only)
        if: runner.os == 'Linux' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-linux
          path: |
            coverage.json
            coverage.txt
          if-no-files-found: error
          retention-days: 14
