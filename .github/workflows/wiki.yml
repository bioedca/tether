#
# wiki — mirror the reviewed `wiki/` source onto this repository's GitHub wiki (#189).
#
# The wiki is an INDEX of https://bioedca.github.io/tether/, never a second home for
# documentation. Content is therefore authored only in the normal branch/PR flow, and this
# workflow is a mechanical mirror: it never authors, and it runs only from `main`, so nothing
# reaches the wiki without review.
#
# The mirror is EXACT — the wiki tree is replaced by `wiki/`, so anything not in `wiki/` is
# deleted and an edit made in the wiki's own editor is discarded on the next push to `main`.
# That is the point: such an edit would otherwise drift silently from the docs site, which is
# the failure mode #189 exists to close. Add a page by adding it to `wiki/` in a pull request.
name: wiki

on:
  push:
    branches: [main]
    # Deliberately NO `paths:` filter. Drift comes from someone editing the wiki in its own
    # editor, which touches nothing here — so a filter on `wiki/**` would leave that edit live
    # until a later push happened to touch the source, i.e. possibly never. Syncing on every
    # push is what makes "exact mirror" true rather than aspirational; when nothing changed the
    # job says so and exits without a commit.
  workflow_dispatch:

# Read-only by default (repo convention); the one job elevates `contents` because a wiki push
# is authorized by the parent repository's write permission. No repository setting is changed.
permissions:
  contents: read

concurrency:
  group: wiki-publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only from reviewed `main`, and only on the upstream repository. A `workflow_dispatch`
    # aimed at any other ref skips rather than publishing an unreviewed branch's `wiki/`.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == 'bioedca/tether'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mirror wiki/ to the wiki repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077

          # Feed the short-lived token to git over askpass rather than the remote URL, so it is
          # never written into .git/config and never appears in a process listing.
          askpass="$RUNNER_TEMP/tether-wiki-askpass"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0

          checkout="$RUNNER_TEMP/tether-wiki"
          # Full clone, not --depth 1: the wiki is a single page, so the shallow history buys
          # nothing and would make the push depend on the server accepting a shallow update.
          git clone "https://github.com/$REPOSITORY.wiki.git" "$checkout"

          # A GitHub wiki with no root `Home` page has no landing page at all, and losing it is a
          # mistake far more often than an intention. Gate on that one file rather than on "any
          # Markdown anywhere", so the check, the message and this comment all say the same thing.
          if [ ! -f wiki/Home.md ]; then
            echo "::error::wiki/Home.md is missing; refusing to publish a wiki with no landing page"
            exit 1
          fi

          # Replace the whole tree, not just root *.md. The wiki clone is an ordinary git repo and
          # can hold files a root glob never matches — nested paths, non-Markdown assets — so a
          # root-glob sync would leave them live forever and "exact mirror" would be false.
          find "$checkout" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R wiki/. "$checkout/"

          cd "$checkout"
          git add -A
          if git diff --cached --quiet; then
            echo "wiki already matches $SOURCE_SHA; nothing to publish"
          else
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "docs(wiki): mirror wiki/ from $SOURCE_SHA"
            git push origin HEAD
          fi
