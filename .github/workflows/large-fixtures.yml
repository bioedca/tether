#
# large-fixtures — the gated heavy-data tier (PRD §8 NFR-FIXTURES, §2.2).
# Runs the `@pytest.mark.large` suite, which the required `test` matrix in ci.yml
# deliberately excludes (`-m "not large and not sidecar"`) so a structural CI run
# never blocks on a Git-LFS pull. This workflow pulls the LFS gated fixtures and
# runs the heavy validation that needs them:
#   * the ≥ 50-molecule (281-mol) idealization reference reads (test_idealize_model); and
#   * the `.tmap` decoder `read_tmap` on the committed bead map, alone and through one
#     `tether extract --tmap` run (test_register.py, test_extract_cli.py; #733).
#
# NOT HERE — the M1 extraction-vs-Deep-LASI acceptance oracle (a) (tests/test_oracle.py).
# Its gate is the one ADR-0022 froze: recall ≥ 95 % at a 2 px match tolerance and a
# donor per-molecule Pearson median ≥ 0.95 (the acceptor Pearson is reported, never
# gated; registration RMS ≤ 0.5 px gates only a native fit). The ~0.9 GB UCKOPSB movie
# it reads is private laboratory data that is NOT committed (not even to LFS) and is on
# no GitHub runner, so since #699 it is a `workstation` test (ADR-0071): the scheduled
# task of scripts/workstation/run_private_checks.py runs it, with the two intake tests and
# the five reader tests on the same bundle, and no CI job collects any of them.
# `scripts/run_m1_oracle.py` is the one-shot reproduction.
#
# Trigger: manual (workflow_dispatch) + weekly (schedule), NOT pull_request — heavy
# and data-gated. It is intentionally NOT a required status check (it must never
# red-gate `main` on an LFS outage).
name: large-fixtures

on:
  workflow_dispatch:
  schedule:
    # Weekly, Mondays 05:23 UTC (off the hour to avoid the cron stampede).
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  large:
    name: large-fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        # Activate the restored micromamba base env (init-shell: bash).
        shell: bash -el {0}
    env:
      QT_QPA_PLATFORM: offscreen
      NAPARI_ASYNC: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Materialise the LFS gated tier (tests/fixtures/large/**) so the
          # large-marked fixtures are real bytes, not pointer stubs.
          lfs: true
      # The large fixtures are committed via LFS, so this workflow MUST have them
      # as real bytes (a `-m large` run would otherwise pass by SKIPPING — the
      # 281-mol and kinSoft tests skip on a pointer stub). Fail loudly if LFS did not
      # pull. The list is every file under tests/fixtures/large/, which
      # tests/test_marker_contract.py checks (#750).
      # (The ~0.9 GB UCKOPSB movie is NOT committed; its oracle runs on the workstation,
      # not here — only these committed LFS artifacts are required here.)
      - name: Verify committed LFS fixtures are materialized
        shell: bash -e {0}
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              Path("tests/fixtures/large/smd_281mol.hdf5"),
              Path("tests/fixtures/large/model_281mol.hdf5"),
              Path("tests/fixtures/large/kinsoft_sim.hdf5"),
              Path("tests/fixtures/large/bead_prealign.tmap"),
              Path("tests/fixtures/large/ebfret_mrec_sessions.hdf5"),
              Path("tests/fixtures/large/campos_chavez_2024/smFRET_SourceData/intraFRET_WT+WT_13uM.txt"),
          ]
          missing = [
              str(p)
              for p in required
              if not p.is_file()
              or p.read_bytes()[:64].startswith(b"version https://git-lfs")
          ]
          if missing:
              raise SystemExit("Git-LFS did not materialize: " + ", ".join(missing))
          print("LFS fixtures materialized:", ", ".join(str(p) for p in required))
          PY
      - name: Restore env + install tether
        uses: ./.github/actions/setup-env
      - name: Install xvfb (Linux headless GL for napari)
        shell: bash -e {0}
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Install test tooling
        run: python -m pip install "pytest==9.1.1" "pytest-qt==4.5.0"
      # Run ONLY the gated tier. A skip is allowed only where the skip budget below
      # lists it (today the torch module of the deep stack).
      # The JUnit report feeds the skip budget below (#726).
      - name: Run large-fixture tests
        id: pytest
        run: xvfb-run -a pytest -v -m large --junitxml="$RUNNER_TEMP/pytest-junit.xml"
      # "Green by skipping" is allowed only for the skips that tests/skip_budget.toml lists for
      # this job, each with its reason. This step fails the job when another test skips, when
      # more tests skip than the job allows, or when fewer tests ran than its committed
      # minimum (#726). It runs after a red pytest step too.
      - name: Compare the skips with the committed budget
        if: ${{ !cancelled() && (steps.pytest.outcome == 'success' || steps.pytest.outcome == 'failure') }}
        env:
          SKIP_BUDGET_JOB: large-fixtures
        run: python scripts/check_skips.py --job "$SKIP_BUDGET_JOB" --report "$RUNNER_TEMP/pytest-junit.xml"

  report:
    # A failed weekly run opens or updates one issue, and the next pass says so (#697). The called
    # workflow decides the event (never a pull request) and is the only job here that writes.
    needs: large
    if: ${{ !cancelled() }}
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/scheduled-failure.yml
    with:
      job-name: large-fixtures
      result: ${{ needs.large.result }}
      oracle: "other / unsure"
      fixture-tier: "gated large (tests/fixtures/large/, LFS — large-fixtures.yml)"
