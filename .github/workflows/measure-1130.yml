# TEMPORARY (#1130): measure the smoothed-TDP deviation from checkTDP.py on three operating systems.
# Removed again before review; ADR-0097 records the numbers it printed.
name: measure-1130
on:
  push:
    branches: [agent/issue-1130]
    paths: [".github/workflows/measure-1130.yml"]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -el {0}
    env:
      TETHER_REFERENCE_DOWNLOAD: "1"
      TETHER_REFERENCE_CACHE: ${{ github.workspace }}/.reference-data-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore env + install tether
        uses: ./.github/actions/setup-env
      - name: Measure
        run: |
          python -c "import platform, numpy, scipy; print(platform.platform(), numpy.__version__, scipy.__version__)"
          python - > "measure-${{ runner.os }}.json" <<'PY'
          import json, sys
          sys.path.insert(0, "tests")
          import _campos_chavez_2024 as c
          from reference_data import fetch
          book = c.read_book(fetch.path_for(c.ARCHIVE_ID))
          out = {s: c.compare_tdp_view(book[s]) for s in c.TDPS}
          out["built"] = c.compare_tdp_view_columns(*c.built_tdp_columns())
          for name, err in {"filter-1.1": {"smooth": (1.1, 1.1)}, "final-1.1": {"smooth": (1.0, 1.1)},
                            "initial-1.1": {"smooth": (1.1, 1.0)}, "not-normalized": {"normalize": False}}.items():
              out["built-" + name] = c.compare_tdp_view_columns(*c.built_tdp_columns(), **err)
              for s in c.TDPS:
                  i, f = c.column(book[s], "Initial E_FRET", 0), c.column(book[s], "Final E_FRET", 1)
                  out[s + "-" + name] = c.compare_tdp_view_columns(i, f, **err)
          print(json.dumps(out, indent=1))
          PY
          cat "measure-${{ runner.os }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measure-${{ runner.os }}
          path: measure-${{ runner.os }}.json
