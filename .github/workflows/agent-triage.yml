#
# Turns check and review events into the labels the launcher reads in ONE call, so a worker that has
# already exited does not have to poll for them. The retired model made 977 `wait_*` calls, one
# unbroken run of 162 (ADR-0057); this is the eventing that replaces them.
#
# It is also the half of the review cap that makes it bind. `agent:review-capped` is published at two
# rounds and `agent:needs-amend` is then withheld - and that label is the launcher's authority to
# start an AMEND session, so a third round is never authorised rather than merely forbidden. The cap
# failed on #276 at 9 rounds against a limit of 2 because prose was the only thing holding it.
#
# BOT-TRIGGER PROBE - the answer, recorded because it decides how strong this control is.
#   Question: does `@codex review` / `@coderabbitai review` posted by `github-actions[bot]` actually
#   trigger either provider? If yes, the trigger belongs in this workflow and agent-authored triggers
#   can be forbidden outright, which is the strongest form of the control since asking is the only way
#   a round can begin.
#   Status: ANSWERED 2026-07-30 on #299. The trigger stays OUT of this workflow, and the reasons
#   below are the ones that survived review - an earlier draft of this note gave a round-counting
#   reason that is simply false, and Codex said so.
#
#     CodeRabbit: YES, unambiguously. It named the author: "CodeRabbit received the review request
#     from `github-actions[bot]`; starting a review round for the probe."
#
#     Codex: AMBIGUOUS, and read conservatively as no. Seven seconds after the bot's comment it
#     replied "To use Codex here, create a Codex account and connect to github" - an author-identity
#     refusal. Two minutes later it posted a task summary asserting the opposite. Both cannot be
#     true, the trigger of the second is not attributable from outside, and a control you cannot
#     attribute is not a control.
#
#   Why the trigger stays out, on grounds that hold:
#
#     1. A WORKFLOW CANNOT KNOW A DIFF IS DECLARED FINAL. A round is a review at a declared-final
#        green head. Green is not final - a PR goes green repeatedly while work continues - so an
#        event-driven request reviews heads nobody declared, and since a round is a distinct head
#        SHA, each reply at a new head spends one. The cost is real; the mechanism is event
#        repetition, not the split.
#     2. THE TWO LEGS WOULD DESYNCHRONISE. On `high` they must be requested together and answered as
#        ONE round. A workflow fires on its own events; the Codex leg is asked at the final head. Two
#        heads, two rounds, and CodeRabbit answering a head Codex never saw.
#     3. A BOT-AUTHORED `@codex review` CAN START AN AGENT THAT WRITES CODE. On #299 the mention was
#        followed by Codex running an agentic task that edited files and committed `25a275d` in its
#        own sandbox (never pushed - verified absent from this remote). A workflow able to post that
#        mention is a workflow able to start an agent with commit authority. That alone is reason
#        enough to keep the capability off the default branch.
#
#   NOT a reason, and recorded because it was written down before it was checked: "auto-requesting
#   one provider turns one round into two" at a single head. It does not. `_review_state` groups by
#   head SHA and `rounds = len(reviewed)`, so two providers at one head are one round by design.
#
#   The cap therefore rests on this counter PLUS the launcher's refusal PLUS a post-merge audit
#   (#300) - genuinely weaker than a platform-enforced trigger, and said plainly rather than implied.
#   `pull_request_review` is a different matter and was also measured: on #285 a review submission
#   DID run this workflow from the pull request's own head. That is worth knowing for two reasons -
#   the review paths are testable before merge, and a PR can therefore run its OWN version of this
#   file with `issues: write`. The checkout pin below removes the unreviewed-*Python* half of that;
#   the workflow *definition* still comes from the head on review events, which is inherent to the
#   trigger and is accepted here because the repository is user-owned with no external contributors.
#   Do not read the pin as making a contributor-facing repository safe.
#
# The counter can UNDERCOUNT and never overcounts: only head-bound evidence (review submissions and
# inline review comments, which carry commit_id) is counted, so a provider answering in a plain issue
# comment is invisible to it. That happened on #282. See .agents/bin/triage.py. Do not promote this to
# a required check on the counter alone.
name: agent-triage

on:
  # A completed suite is the state change that decides whether an AMEND is owed. NOTE: like
  # `schedule`, `check_suite` only ever triggers from the workflow file on the DEFAULT branch, so this
  # trigger cannot be exercised by its own pull request - verify with the dispatch below after merge,
  # exactly as agent-reaper.yml was. The two review triggers DO fire from a PR head; see the probe
  # note above.
  check_suite:
    types: [completed]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull-request number to triage"
        required: true
      dry_run:
        description: "Report what would change without writing any label"
        type: boolean
        default: true

# Least privilege, stated explicitly. With an explicit block every UNLISTED scope is `none`, so an
# omission is a 403 rather than a default - and triage.py fails closed on one, which stops the run
# rather than publishing a wrong round count.
#   issues: write          add/remove the agent:round-*/agent:review-capped/agent:needs-amend labels
#   pull-requests: read    read PR state, reviews and inline review comments. Never `write`: this
#                          workflow has no mutation to make on a PR, and standing authority for one
#                          it cannot perform is what #277 removed from the reaper
#   checks: read           read /commits/{sha}/check-suites. `statuses: read` does NOT cover it, and
#                          without it a head whose CI is still running looks green
#   contents: read         checkout only
permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: read

concurrency:
  # Per pull request, not global: two PRs must triage in parallel, but two events on ONE PR must not
  # race to write its labels. Never cancel - a cancelled run leaves the labels describing an older
  # head, and the launcher would read that as authority.
  #
  # KEYED ON THE HEAD BRANCH FOR EVERY REAL EVENT, which is the point. Using the PR number for review
  # events and the branch for check_suite gave one PR two different keys, so a delayed check run could
  # snapshot pre-cap state and apply its stale delta *after* the review run published the cap. The
  # branch is the right normaliser rather than the PR number: it is present on both event payloads,
  # whereas `check_suite.pull_requests` can be empty. Branch and PR are 1:1 here because the branch
  # IS the claim ref.
  #
  # `workflow_dispatch` can only key on the number it was given, so a manual run does not serialise
  # against a concurrent event. That is why it defaults to `dry_run: true`: the un-normalised path
  # writes nothing unless a human deliberately says otherwise.
  group: >-
    agent-triage-${{ github.event.pull_request.head.ref
      || github.event.check_suite.head_branch
      || format('dispatch-{0}', inputs.pr) }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Cheap pre-filter so the common case - a check suite on main, on a maintainer branch, or on any
    # branch that is not a claim ref - costs no runner minutes. triage.py re-checks the same thing
    # from the API and is the authority; this only avoids the spawn.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event_name == 'pull_request_review'
      || github.event_name == 'pull_request_review_comment'
      || startsWith(github.event.check_suite.head_branch, 'agent/issue-')
    steps:
      # PINNED TO THE DEFAULT BRANCH, NOT THE EVENT'S REF. `pull_request_review` and
      # `pull_request_review_comment` are pull-request-family events, so GITHUB_REF is the PR's MERGE
      # ref - the default checkout would take `triage.py` and the `claim.py` it imports from the
      # unmerged branch under review. Any PR touching either file would then execute unreviewed Python
      # with GH_TOKEN and `issues: write`, on a workflow whose whole job is to publish review state.
      # The default branch is reviewed code by construction (`main` takes no direct pushes).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Publish review-round state
        shell: bash -el {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Untrusted event data is passed through env, never interpolated into the script body.
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          HEAD_BRANCH: ${{ github.event.check_suite.head_branch }}
          # A manual run defaults to dry-run; a real event always acts.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          # BOOTSTRAP GUARD, and deliberately a narrow one. The checkout above is pinned to the
          # DEFAULT branch, so on the pull request that introduces this workflow the script does not
          # exist there yet and `python .agents/bin/triage.py` fails with ENOENT - which is exactly
          # what happened on #285 before this guard existed.
          #
          # The two cases are distinguished rather than both waved through, because "the script is
          # missing" is otherwise indistinguishable from a real breakage:
          #   * workflow present on the default branch, script absent -> someone removed or moved the
          #     script and left its workflow behind. FAIL LOUDLY.
          #   * neither present -> this workflow is newer than the default branch, i.e. its own
          #     introducing PR. Report and do nothing. This branch stops being reachable the moment
          #     the workflow lands, so it cannot become a standing excuse.
          if [ ! -f .agents/bin/triage.py ]; then
            if [ -f .github/workflows/agent-triage.yml ]; then
              echo "::error::agent-triage.yml is on the default branch but triage.py is missing"
              exit 1
            fi
            echo "::notice::agent-triage is not on the default branch yet; nothing to publish."
            printf '## agent-triage\n\nNot on the default branch yet; nothing published.\n' \
              > "${GITHUB_STEP_SUMMARY}"
            # No explicit `exit 0`: in a `bash -el {0}` step an explicit zero exit is reported as a
            # FAILURE on the runner. Fall through to a terminal command instead.
            true
          else
          args=()
          if [ -n "${PR_NUMBER}" ]; then
            args+=(--pr "${PR_NUMBER}")
          else
            args+=(--branch "${HEAD_BRANCH}")
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          python .agents/bin/triage.py "${args[@]}" | tee /tmp/triage.json
          python - <<'PY'
          import json, os, pathlib
          r = json.loads(pathlib.Path("/tmp/triage.json").read_text("utf-8"))
          if r["action"] == "skip":
              lines = ["## agent-triage", "", f"Skipped: **{r['reason']}**"]
          else:
              lines = [
                  "## agent-triage",
                  "",
                  f"PR #{r['pr']} → issue #{r['issue']} · checks **{r['checks']}**",
                  "",
                  f"| rounds | capped | amend | added | removed |",
                  "|---|---|---|---|---|",
                  f"| {r['rounds']} of 2 | {r['capped']} | {r['amend']} "
                  f"| {', '.join(r['added']) or '—'} | {', '.join(r['removed']) or '—'} |",
              ]
              if r["capped"]:
                  lines += ["", "**At the cap.** No AMEND authority is issued; this PR needs the maintainer."]
          pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines), encoding="utf-8")
          PY
          fi
