# TEMPORARY (#756): measure the Campos-Chavez 2024 deviations on three operating systems.
# Removed again before review; ADR-0097 records the numbers it printed.
name: measure-756
on:
  push:
    branches: [agent/issue-756]
    paths: [".github/workflows/measure-756.yml"]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -el {0}
    env:
      TETHER_REFERENCE_DOWNLOAD: "1"
      TETHER_REFERENCE_CACHE: ${{ github.workspace }}/.reference-data-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore env + install tether
        uses: ./.github/actions/setup-env
      - name: Measure
        run: |
          python -c "import sys; sys.path.insert(0, 'tests'); from reference_data import fetch; print(fetch.path_for('campos2024-source-data'))" > archive.txt
          python tests/_campos_chavez_2024.py "$(cat archive.txt)" > "measure-${{ runner.os }}.json"
          python -c "import numpy, scipy, platform; print(platform.platform(), numpy.__version__, scipy.__version__)"
          cat "measure-${{ runner.os }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measure-${{ runner.os }}
          path: measure-${{ runner.os }}.json
