# TEMPORARY (#1129): measure the mean dwell time of the three fitted Campos-Chavez 2024 panels on
# three operating systems. Removed again before review; ADR-0097 records the numbers it printed.
name: measure-1129
on:
  push:
    branches: [agent/issue-1129]
    paths: [".github/workflows/measure-1129.yml"]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -el {0}
    env:
      TETHER_REFERENCE_DOWNLOAD: "1"
      TETHER_REFERENCE_CACHE: ${{ github.workspace }}/.reference-data-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore env + install tether
        uses: ./.github/actions/setup-env
      - name: Measure
        run: |
          python - > "measure-${{ runner.os }}.json" <<'PY'
          import json, sys
          sys.path.insert(0, "tests")
          from reference_data import fetch
          from _campos_chavez_2024 import (
              DOUBLE_PARAMS, compare_survival, read_book, read_double_out, read_double_params,
          )
          archive = fetch.path_for("campos2024-source-data")
          book = read_book(archive)
          out = {}
          for (sheet, col), name in sorted(DOUBLE_PARAMS.items()):
              out[name] = compare_survival(
                  book[sheet], col, "double",
                  read_double_params(archive, name), read_double_out(archive, name),
              )
          print(json.dumps(out, indent=1))
          PY
          python -c "import numpy, scipy, platform; print(platform.platform(), numpy.__version__, scipy.__version__)"
          cat "measure-${{ runner.os }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measure-${{ runner.os }}
          path: measure-${{ runner.os }}.json
