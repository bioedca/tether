#
# Tether — packaging, lint, and test configuration.
#
# Dependency PINS live in the committed conda locks (the base `conda-lock.yml`
# plus the isolated `sidecar/conda-lock.yml`), NOT here: the PRD pin-and-hold
# policy keeps exact versions in the lock as the single source of truth
# (PRD §4.1). `requires-python` below is only the supported FLOOR; the concrete
# interpreter pin (inside Numba's supported window) is owned by the base
# conda-lock, which lands in a follow-up PR.

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "tether"
description = "A cross-platform single-molecule FRET desktop suite (Mondragón Lab, Northwestern)."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "The Tether Authors", email = "bioedca@u.northwestern.edu" }]
keywords = ["smFRET", "single-molecule", "FRET", "microscopy", "biophysics"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dynamic = ["version"]

# Runtime dependencies are intentionally NOT declared here — the locked conda
# environment provides the scientific stack (PRD §4.1), and CI installs the
# package with `pip install -e . --no-deps`. The extras below are dev-time
# conveniences only and remain unpinned (the lock is authoritative).
# `markdown-it-py` is the CommonMark parser behind `.agents/bin/markdown_structure.py`
# (ADR-0066): dev-only, never imported by `src/tether`, and already pinned in the
# base lock as a transitive dependency, so it is declared here and in the CI pip
# lines rather than added to `environment.yml`.
# There is deliberately no `docs` extra: `requirements-docs.txt` is the single pinned
# source of truth for the docs toolchain (mkdocs, mkdocs-material, mike), shared by the
# required `docs-build` gate and the `docs.yml` publish. An unpinned extra here was a
# second, wrong copy of it — it lacked `mike` (#183).
[project.optional-dependencies]
test = ["pytest", "pytest-qt", "coverage"]
dev = ["ruff", "pre-commit", "reuse", "markdown-it-py"]

# Console entry point (PRD §7.11 headless core). Stdlib argparse — no runtime
# dependency, so no conda-lock change (pin-and-hold). Real subcommands land at M1.
[project.scripts]
tether = "tether.cli:main"

# GUI entry point (PRD §7.8). `gui-scripts` — not `scripts` — so Windows gets the
# console-less `tether-gui.exe` launcher and a desktop shortcut does not flash a
# terminal. This is the target a menu shortcut opens; see ADR-0051.
# NOT `tether.gui.shell:launch`, which fabricates synthetic traces for the
# hand-driven live smoke and would ship a demo instead of the application.
[project.gui-scripts]
tether-gui = "tether.gui.app:main"

[project.urls]
Homepage = "https://github.com/bioedca/tether"
Repository = "https://github.com/bioedca/tether"
Issues = "https://github.com/bioedca/tether/issues"

# --- Version: derived from git via hatch-vcs (PRD §4.1 "version from git") ----
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/tether/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tether"]

# --- Ruff: lint + format (CI `lint` job, PRD §12.6) --------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# `_version.py` is generated by hatch-vcs at build time (and gitignored); never
# lint/format it. Explicit so the CI `lint` job is robust even where ruff's
# gitignore detection does not apply (e.g. a linked git worktree). The published scripts of the
# Source Data copy (#755, ADR-0083) are third-party files that may not be changed.
extend-exclude = ["src/tether/_version.py", "tests/fixtures/campos_chavez_2024"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "D"]

# The docstring standard (#611, ADR-0093, docs/maintainers/docstring-style.md): the `D` rules
# with the NumPy convention, for `src/tether` only.
[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # allow re-exports from package __init__ files
"!src/tether/**" = ["D"] # the docstring standard covers the package, not tests or scripts
# The docstring allowlist (#611, ADR-0093). Each entry names the `D` rules that a file broke
# when the check was turned on. It can only become shorter: `tests/test_docstring_standard.py`
# fails on an entry that `main` does not have, and `scripts/check_docstring_allowlist.py` (the
# CI `lint` job) fails on an entry that no longer hides a violation. Fix a docstring, then
# remove its entry.
"src/tether/analysis/anticorrelation.py" = ["D301"]
"src/tether/analysis/cloud.py" = ["D401"]
"src/tether/analysis/crosscorr.py" = ["D401"]
"src/tether/analysis/histogram.py" = ["D401"]
