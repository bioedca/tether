[tool.ruff.lint.isort]
known-first-party = ["tether"]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"

# --- Coverage (the Linux leg of the CI `test` matrix; #724, ADR-0072) ----------
# The floors are in `.github/coverage-floors.toml`. Two modules are left out by name, because
# they never run in the base environment that the matrix uses:
[tool.coverage.run]
branch = true
source_pkgs = ["tether"]
relative_files = true
omit = [
  # Runs only in the isolated tMAVEN sidecar interpreter (PRD §4.3), started as a script by
  # `tether.idealize.driver`; the base env cannot import tmaven.
  "*/tether/idealize/_sidecar_runner.py",
  # Imports torch at module top, so it runs only in the optional `deep/` stack (ADR-0047).
  "*/tether/ml/deep/_torch_model.py",
]

# --- Pytest (CI `test` 3-OS matrix, PRD §12.6) -------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
  "gui: exercises the PySide6/napari/pyqtgraph GUI (run headless: QT_QPA_PLATFORM=offscreen).",
  "large: needs the gated large-fixture tier (never part of the default required matrix).",
  "sidecar: drives the live tMAVEN sidecar env (needs $TETHER_SIDECAR_PYTHON; never in the CI matrix).",
  "deep: drives the live torch deep-classifier env (deep/conda-lock.yml; the non-required deep.yml leg, never in the base matrix).",
  "workstation: needs private laboratory data; runs only from scripts/workstation/run_private_checks.py on the maintainer's workstation, never in a CI job (ADR-0071).",
  "reference_download: downloads a reference data set of tests/reference_data/manifest.toml (the weekly reference-data.yml job, never in the required matrix; ADR-0073).",
]
