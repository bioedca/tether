version = 1
SPDX-PackageName = "Tether"
SPDX-PackageSupplier = "The Tether Authors <bioedca@u.northwestern.edu>"
SPDX-PackageDownloadLocation = "https://github.com/bioedca/tether"

# Blanket licensing for files that do not carry their own SPDX header
# (docs, config, metadata). Python sources carry per-file SPDX headers and
# take precedence over this aggregate entry. See PRD §12.1 (SPDX / REUSE).
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Tether Authors <bioedca@u.northwestern.edu>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# kinSoftChallenge simulated datasets — third-party reference data, CC-BY-4.0
# (Götz & Schmid, Zenodo 10.5281/zenodo.5701310), aggregated as gated-tier test
# fixtures. `override` beats the blanket GPL entry above for these specific data
# files (they carry no SPDX header of their own). Attributed in NOTICE and the
# fixture PROVENANCE; the MATLAB simulator from the same record is NOT vendored
# (PRD N2). See PRD §8 NFR-VALID(c) / §9 M8.
[[annotations]]
path = ["tests/fixtures/large/kinsoft_sim.hdf5", "tests/fixtures/kinsoft_trace_sample.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2021 Markus Götz and Sonja Schmid (kinSoftChallenge)"
SPDX-License-Identifier = "CC-BY-4.0"

# Source Data of Campos-Chavez et al., Nat Commun 15:6592 (2024), doi:10.1038/s41467-024-50885-x
# (#755, ADR-0083): unchanged copies of members of the publisher's archive
# 41467_2024_50885_MOESM4_ESM.zip, under CC BY-NC-ND 4.0 as published, NOT GPL-3.0. Non-commercial
# use only, and no changed copy may be shared. `override` beats the blanket GPL entry above.
# Attributed in NOTICE, docs/validation.md and tests/fixtures/PROVENANCE.md.
[[annotations]]
path = ["tests/fixtures/campos_chavez_2024/**", "tests/fixtures/large/campos_chavez_2024/**"]
precedence = "override"
SPDX-FileCopyrightText = "2024 The Author(s): Eduardo Campos-Chavez, Sneha Paul, Zunwu Zhou, Dulce Alonso, Anjali R. Verma, Jingyi Fei, Alfonso Mondragón"
SPDX-License-Identifier = "CC-BY-NC-ND-4.0"

# Tether brand kit from mark 42a (#671): the mark, the icons, the installer and site images,
# the colour tokens and the 16 px review image. CC-BY-4.0, not GPL, so anyone may use the mark
# with credit (docs/brand.md gives the rules). `override` beats the blanket GPL entry above.
# The generator in scripts/brand/ stays GPL-3.0-or-later through its own SPDX headers.
[[annotations]]
path = [
  "src/tether/gui/assets/brand/**",
  "packaging/images/**",
  "docs/assets/brand/**",
  "scripts/brand/icon-16px-before-after.png",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 The Tether Authors <bioedca@u.northwestern.edu>"
SPDX-License-Identifier = "CC-BY-4.0"

# Red Hat Display (Regular, Medium, Bold), the upstream TTF files unchanged, with the upstream
# OFL.txt beside them; the documentation site carries copies of Medium and Bold for its
# headings (#674). From github.com/RedHatOfficial/RedHatFont at commit 6bb1048; the
# copyright years are those of that OFL.txt (2021) and of the fonts' name table (2024).
# Listed after the brand entry above: when two annotations match a file, the last one wins.
[[annotations]]
path = ["src/tether/gui/assets/brand/fonts/**", "docs/assets/fonts/**"]
precedence = "override"
SPDX-FileCopyrightText = [
  "2021 The Red Hat Project Authors (https://github.com/RedHatOfficial/RedHatFont)",
  "2024 The Red Hat Project Authors (https://github.com/RedHatOfficial/RedHatFont)",
]
SPDX-License-Identifier = "OFL-1.1"
