interface:
  display_name: "Tether Worker"
  short_description: "Claim one accepted issue and open its draft PR onto the review lane"
  default_prompt: "Use $tether-worker to claim issue #N with .agents/bin/claim.py, implement it in an isolated worktree, open a DRAFT PR, request the first Codex review, write the lane state into the PR body, and exit. Do not arm auto-merge: that happens at the end of the review lane, once the gate is closed — by a clean metered review (Greptile on a code PR, CodeRabbit when Greptile has no credit), by a clean Codex review alone on a docs-only or test-only PR, or by a posted Codex review of the final head when the metered one-review cap is spent. AGENTS.md §Review carries the conditions on those paths, and this prompt states none of them, so read them there rather than inferring them from this line."
